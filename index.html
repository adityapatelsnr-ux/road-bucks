<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Bucks - Gang Radar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Top Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
        <div>
            <h1 class="text-xl font-bold text-amber-400">Road Bucks</h1>
            <p class="text-xs text-slate-400" id="room-display">ROOM: NOT CONNECTED</p>
        </div>
        <div class="bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
            <span class="text-amber-400 font-bold" id="score-val">100</span>
            <span class="text-xs text-amber-200">🪙</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="space-y-4 my-auto py-4">
        <!-- Welcome Card -->
        <div class="bg-slate-800/80 p-5 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-lg font-semibold text-slate-200" id="welcome-title">Welcome, Operator!</h2>
            <p class="text-xs text-slate-400 mt-1">Direct Single-File Gang Radar System.</p>
        </div>

        <!-- Radar Status Card -->
        <div class="bg-slate-800/80 p-5 rounded-xl border border-slate-700 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-slate-300">⚡ ACTIVE GANG MEMBERS</span>
                <span id="online-count" class="bg-red-500/20 text-red-400 text-xs px-2.5 py-1 rounded-full font-semibold border border-red-500/30">Connecting...</span>
            </div>
            <div id="members-list" class="text-xs text-slate-400 space-y-1 max-h-32 overflow-y-auto">
                Connecting to radar...
            </div>
        </div>

        <!-- Room Key Input Card -->
        <div class="bg-slate-800/80 p-5 rounded-xl border border-slate-700 shadow-xl space-y-3">
            <label class="block text-sm font-medium text-slate-300">🔑 GANG ROOM / SECRET KEY</label>
            <p class="text-xs text-slate-400">Dono phone mein same key daalo (e.g. 1234)</p>
            <div class="flex gap-2">
                <input type="text" id="room-input" placeholder="Room Key..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                <button onclick="joinRoom()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition">Connect</button>
            </div>
        </div>

        <!-- Profile Settings Card -->
        <div class="bg-slate-800/80 p-5 rounded-xl border border-slate-700 shadow-xl space-y-3">
            <label class="block text-sm font-medium text-slate-300">👤 OPERATOR PROFILE</label>
            <div class="flex gap-2">
                <input type="text" id="name-input" placeholder="Your Operator Name..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                <button onclick="saveProfile()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">Save</button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="grid grid-cols-4 gap-2 bg-slate-800 p-2 rounded-xl border border-slate-700 text-center text-xs">
        <a href="#" class="py-2 rounded-lg bg-amber-500/10 text-amber-400 font-medium">🏠 Home</a>
        <a href="#" class="py-2 rounded-lg text-slate-400 hover:bg-slate-700/50">🚗 Garage</a>
        <a href="#" class="py-2 rounded-lg text-slate-400 hover:bg-slate-700/50">🛡️ Fines</a>
        <a href="#" class="py-2 rounded-lg text-slate-400 hover:bg-slate-700/50">🔒 Vouchers</a>
    </nav>

    <!-- Script Logic -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://road-bucks-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoom = localStorage.getItem('rb_room') || '1234';
        let operatorName = localStorage.getItem('rb_name') || 'Operator_' + Math.floor(Math.random() * 90 + 10);
        let myId = 'user_' + Math.random().toString(36).substring(2, 9);

        document.getElementById('room-input').value = currentRoom;
        document.getElementById('name-input').value = operatorName;
        document.getElementById('welcome-title').innerText = `Welcome, ${operatorName}!`;

        let connectedRef = db.ref('.info/connected');
        let userPresenceRef = null;

        function joinRoom() {
            const key = document.getElementById('room-input').value.trim();
            if(!key) return alert('Please enter a room key!');
            currentRoom = key;
            localStorage.setItem('rb_room', currentRoom);
            setupRadar();
            alert(`Connected to Gang Room: ${currentRoom}`);
        }

        function saveProfile() {
            const name = document.getElementById('name-input').value.trim();
            if(!name) return alert('Name cannot be empty!');
            operatorName = name;
            localStorage.setItem('rb_name', operatorName);
            document.getElementById('welcome-title').innerText = `Welcome, ${operatorName}!`;
            if(userPresenceRef) {
                userPresenceRef.update({ name: operatorName });
            }
            alert('Profile saved successfully!');
        }

        function setupRadar() {
            document.getElementById('room-display').innerText = `ROOM: ${currentRoom}`;
            
            if(userPresenceRef) userPresenceRef.remove();

            userPresenceRef = db.ref(`gangs/${currentRoom}/${myId}`);
            
            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userPresenceRef.set({
                        name: operatorName,
                        lastActive: firebase.database.ServerValue.TIMESTAMP
                    });
                    userPresenceRef.onDisconnect().remove();
                }
            });

            const roomRef = db.ref(`gangs/${currentRoom}`);
            roomRef.on('value', (snapshot) => {
                const membersList = document.getElementById('members-list');
                const onlineCount = document.getElementById('online-count');
                membersList.innerHTML = '';
                
                const data = snapshot.val();
                if(data) {
                    const keys = Object.keys(data);
                    onlineCount.innerText = `${keys.length} Online`;
                    onlineCount.className = "bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold border border-emerald-500/30";

                    keys.forEach(id => {
                        const member = data[id];
                        const div = document.createElement('div');
                        div.className = "flex items-center justify-between bg-slate-900/50 px-3 py-1.5 rounded border border-slate-700/50";
                        div.innerHTML = `<span>🟢 ${member.name}</span> <span class="text-[10px] text-slate-500">Active</span>`;
                        membersList.appendChild(div);
                    });
                } else {
                    onlineCount.innerText = "0 Online";
                    onlineCount.className = "bg-red-500/20 text-red-400 text-xs px-2.5 py-1 rounded-full font-semibold border border-red-500/30";
                    membersList.innerHTML = "No operators in this room.";
                }
            });
        }

        setupRadar();
    </script>
</body>
</html>
